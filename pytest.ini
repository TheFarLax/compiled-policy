[pytest]
# The default run is direct mode only: in-process, no network, no model,
# deterministic, and fast. tests/integration needs a live GenLayer endpoint and
# is run explicitly with `gltest`.
#
# tests/proof loads contracts/compiled_policy.py as a plain module so the exact
# equivalence abstraction can be checked against a brute-forced payload space --
# a completeness claim cannot be tested through the contract's public API alone.
testpaths = tests/direct tests/proof
